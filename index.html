<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examora - امتحانات ومتابعة للمدرس والطالب وولي الأمر</title>
<meta name="description" content="Examora: امتحانات بتتصحح لوحدها، مستوى كل طالب في كل درس بالألوان، امتحان جديد كل أسبوع، ومتابعة لولي الأمر. ثانوية عامة، بكالوريا، SAT، ACT، EST، IGCSE.">
<meta property="og:title" content="Examora">
<meta property="og:description" content="امتحانات ومتابعة للمدرس والطالب وولي الأمر - Exams and progress for teachers, students and parents.">
<meta name="theme-color" content="#0B2C8F">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
@font-face{font-family:Cairo;font-weight:400;font-display:swap;src:url(fonts/cairo-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:700;font-display:swap;src:url(fonts/cairo-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:900;font-display:swap;src:url(fonts/cairo-arabic-900-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:400;font-display:swap;src:url(fonts/cairo-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cairo;font-weight:700;font-display:swap;src:url(fonts/cairo-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cairo;font-weight:900;font-display:swap;src:url(fonts/cairo-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--navy:#0B2C8F;--blue:#1769E8;--sky:#19A7FF;--ink:#0E1B3D;--mut:#55658A;--bg:#F4F7FE;--card:#fff;--line:#DCE5F8;--green:#16A34A;--amber:#D99A00;--red:#D32F2F;--r:22px;--sh:0 18px 50px rgba(11,44,143,.12)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.7;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:var(--blue)}
.wrap{max-width:1140px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid transparent;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:#fff;color:var(--navy);box-shadow:0 10px 28px rgba(0,0,0,.18)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(23,105,232,.3)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.btn.line{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.sm{min-height:38px;padding:6px 16px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(11,44,143,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);color:#fff}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900;font-size:22px;letter-spacing:.3px}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff}
.nav{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
.nav a.lk{color:#DCE8FF;text-decoration:none;font-weight:700;font-size:15px;padding:8px 10px;border-radius:10px}
.nav a.lk:hover{background:rgba(255,255,255,.1);color:#fff}
.lang{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;font:inherit;font-weight:700;font-size:14px;padding:6px 14px;cursor:pointer}
@media (max-width:860px){.nav a.lk{display:none}}
/* hero */
.hero{position:relative;color:#fff;background:linear-gradient(150deg,#0B2C8F 0%,#1460DD 55%,#19A7FF 100%);overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1.6px,transparent 1.6px);background-size:34px 34px;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding-top:56px;padding-bottom:72px}
.chip{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
.hero h1{font-size:clamp(32px,5.2vw,56px);line-height:1.25;margin:14px 0 12px;font-weight:900}
.hero h1 .hl{color:#FFE066}
.hero p.lead{font-size:clamp(17px,2vw,20px);color:#E3EDFF;margin:0 0 24px;max-width:600px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.login-l{color:#fff;font-weight:700;margin-top:14px;display:inline-block}
.ticks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-weight:700;font-size:14px;color:#E3EDFF}
.ticks span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CF5A0;margin-inline-end:8px;vertical-align:middle}
.stage{position:relative;min-height:520px}
.desk{background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(4,16,60,.45);overflow:hidden;border:1px solid rgba(255,255,255,.4)}
.desk .bar{height:26px;background:#EEF2FB;display:flex;align-items:center;gap:6px;padding:0 10px}
.desk .bar i{width:9px;height:9px;border-radius:50%;background:#C9D3EA}
.stage .desk{position:absolute;inset-inline-start:0;top:30px;width:92%}
.phone{background:#0A1A4F;border-radius:34px;padding:9px;box-shadow:0 30px 60px rgba(4,16,60,.5)}
.phone img{border-radius:26px;background:#fff}
.stage .phone{position:absolute;inset-inline-end:0;top:0;width:44%;max-width:250px}
.float{position:absolute;background:#fff;color:var(--ink);border-radius:16px;padding:10px 14px;box-shadow:0 16px 40px rgba(4,16,60,.3);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.float b{display:inline-block;width:12px;height:12px;border-radius:50%}
.f1{inset-inline-start:4%;bottom:44px}.f2{inset-inline-start:30%;bottom:-6px}
@media (max-width:920px){.hero .wrap{grid-template-columns:1fr;padding-top:36px}.stage{min-height:0;height:min(98vw,500px)}}
/* sections */
section{padding:72px 0}
.sec-h{text-align:center;max-width:760px;margin:0 auto 34px}
.eyebrow{color:var(--blue);font-weight:900;font-size:14px;letter-spacing:.4px}
.sec-h h2{font-size:clamp(26px,3.6vw,38px);line-height:1.3;margin:6px 0 8px;font-weight:900;color:var(--navy)}
.sec-h p{color:var(--mut);margin:0;font-size:17px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:960px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:0 6px 20px rgba(11,44,143,.05)}
.card h3{margin:10px 0 6px;font-size:21px;color:var(--navy);font-weight:900;line-height:1.35}
.card p{margin:0;color:var(--mut)}
.ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}
.ic svg{width:28px;height:28px}
.who .card{position:relative;overflow:hidden}
.who .card:after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(25,167,255,.08)}
/* how */
.steps{counter-reset:s}
.step{position:relative;padding-top:58px}
.step:before{counter-increment:s;content:counter(s);position:absolute;top:20px;inset-inline-start:24px;width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:20px}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;border-radius:999px;padding:3px 12px;color:#fff}
/* showcase */
.show{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:22px}
.tab{font:inherit;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:8px 18px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.view{display:grid;grid-template-columns:1fr 1.25fr;gap:34px;align-items:center}
.view .txt h3{font-size:clamp(22px,2.8vw,30px);color:var(--navy);margin:0 0 8px;line-height:1.35;font-weight:900}
.view .txt p{color:var(--mut);font-size:17px;margin:0 0 12px}
.view .txt ul{margin:0;padding-inline-start:20px;color:var(--ink)}
.view .pic{display:flex;justify-content:center}
.view .pic .phone{width:min(300px,78vw)}
.view .pic .desk{width:100%}
.demo-note{font-size:13px;color:var(--mut);text-align:center;margin-top:12px}
@media (max-width:860px){.view{grid-template-columns:1fr}.view .pic{order:-1}}
/* features */
.feat .card{padding:20px}
.feat .card h3{font-size:18px}
.feat .card p{font-size:15px}
.band{background:linear-gradient(150deg,#0B2C8F,#1769E8);color:#fff;border-radius:28px;padding:34px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;box-shadow:var(--sh)}
.band h2{margin:0 0 6px;font-size:clamp(22px,3vw,30px);line-height:1.35;font-weight:900}
.band p{margin:0;color:#DCE8FF}
.band .big{width:78px;height:78px;border-radius:24px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.band .big svg{width:42px;height:42px}
@media (max-width:760px){.band{grid-template-columns:1fr;text-align:center}.band .big{margin:0 auto}}
.fun{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.fun{grid-template-columns:1fr}}
/* forms */
.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
@media (max-width:900px){.forms{grid-template-columns:1fr}}
.fcard{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:var(--sh);scroll-margin-top:84px}
.fcard h3{margin:0 0 4px;font-size:24px;color:var(--navy);font-weight:900}
.fcard .sub{color:var(--mut);margin:0 0 16px}
.tag{display:inline-block;font-weight:900;font-size:13px;border-radius:999px;padding:2px 12px;margin-bottom:8px}
.tag.s{background:#E6F6EC;color:#11753A}.tag.t{background:#E8F0FF;color:var(--blue)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:#FBFCFF;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.hpw{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.msg{margin-top:12px;font-weight:700;min-height:1px}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.done{background:#E6F6EC;border:1px solid #BFE5CC;border-radius:18px;padding:16px;color:#11573A;font-weight:700}
.fcard .btn{width:100%;margin-top:18px}
.mini{font-size:13px;color:var(--mut);margin-top:10px}
/* faq */
details{background:#fff;border:1px solid var(--line);border-radius:18px;padding:4px 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:700;font-size:17px;padding:12px 0;color:var(--navy);list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";float:inline-end;font-weight:900;color:var(--blue)}
details[open] summary:after{content:"-"}
details p{margin:0 0 14px;color:var(--mut)}
footer{background:#0A1F63;color:#C9D7F5;padding:34px 0;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
footer a{color:#fff;font-weight:700}
.sp{flex:1}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top"><img src="img/logo.png" alt="" width="40" height="40"><span>Examora</span></a>
    <nav class="nav" aria-label="Examora">
      <a class="lk" href="#how" data-t="nHow"></a><a class="lk" href="#see" data-t="nSee"></a><a class="lk" href="#teachers" data-t="nTeachers"></a><a class="lk" href="#faq" data-t="nFaq"></a>
      <a class="btn sm pri" id="loginTop" data-t="login"></a>
      <button class="lang" id="langBtn" type="button"></button>
    </nav>
  </div>
</header>

<main id="top">
<section class="hero" style="padding:0">
  <div class="wrap">
    <div>
      <span class="chip" data-t="heroChip"></span>
      <h1><span data-t="heroH1a"></span> <span class="hl" data-t="heroH1b"></span></h1>
      <p class="lead" data-t="heroLead"></p>
      <div class="cta"><a class="btn pri" href="#start-student" data-t="ctaStudent"></a><a class="btn ghost" href="#start-teacher" data-t="ctaTeacher"></a></div>
      <a class="login-l" id="loginHero" data-t="haveAccount"></a>
      <div class="ticks"><span data-t="tick1"></span><span data-t="tick2"></span><span data-t="tick3"></span></div>
    </div>
    <div class="stage" aria-hidden="true">
      <div class="desk"><div class="bar"><i></i><i></i><i></i></div><img id="heroDesk" alt="" width="1280" height="780"></div>
      <div class="phone"><img id="heroPhone" alt="" width="390" height="844"></div>
      <div class="float f1"><b style="background:var(--green)"></b><span data-t="fl1"></span></div>
      <div class="float f2"><b style="background:var(--red)"></b><span data-t="fl2"></span></div>
    </div>
  </div>
</section>

<section class="who" id="who">
  <div class="wrap">
    <div class="sec-h"><div class="eyebrow" data-t="whoEye"></div><h2 data-t="whoH"></h2><p data-t="whoP"></p></div>
    <div class="grid3">
      <div class="card"><div class="ic" data-ic="cap"></div><h3 data-t="w1h"></h3><p data-t="w1p"></p></div>
      <div class="card"><div class="ic" data-ic="family"></div><h3 data-t="w2h"></h3><p data-t="w2p"></p></div>
      <div class="card"><div class="ic" data-ic="board"></div><h3 data-t="w3h"></h3><p data-t="w3p"></p></div>
    </div>
  </div>
</section>

<section id="how" style="padding-top:0">
  <div class="wrap">
    <div class="sec-h"><div class="eyebrow" data-t="howEye"></div><h2 data-t="howH"></h2><p data-t="howP"></p></div>
    <div class="grid3 steps">
      <div class="card step"><h3 data-t="s1h"></h3><p data-t="s1p"></p></div>
      <div class="card step"><h3 data-t="s2h"></h3><p data-t="s2p"></p><div class="levels"><span class="lv" style="background:var(--green)" data-t="lvG"></span><span class="lv" style="background:var(--amber)" data-t="lvY"></span><span class="lv" style="background:var(--red)" data-t="lvR"></span></div></div>
      <div class="card step"><h3 data-t="s3h"></h3><p data-t="s3p"></p></div>
    </div>
  </div>
</section>

<section class="show" id="see">
  <div class="wrap">
    <div class="sec-h"><div class="eyebrow" data-t="seeEye"></div><h2 data-t="seeH"></h2><p data-t="seeP"></p></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="view">
      <div class="txt"><h3 id="vH"></h3><p id="vP"></p><ul id="vL"></ul></div>
      <div class="pic" id="vPic"></div>
    </div>
    <p class="demo-note" data-t="demoNote"></p>
  </div>
</section>

<section class="feat" id="teachers">
  <div class="wrap">
    <div class="sec-h"><div class="eyebrow" data-t="ftEye"></div><h2 data-t="ftH"></h2><p data-t="ftP"></p></div>
    <div class="grid4" id="feats"></div>
  </div>
</section>

<section id="students" style="padding-top:0">
  <div class="wrap">
    <div class="sec-h"><div class="eyebrow" data-t="stEye"></div><h2 data-t="stH"></h2><p data-t="stP"></p></div>
    <div class="fun" id="funs"></div>
  </div>
</section>

<section id="support" style="padding-top:0">
  <div class="wrap">
    <div class="band"><div class="big" data-ic="support"></div><div><h2 data-t="supH"></h2><p data-t="supP"></p></div><a class="btn pri" href="#start-teacher" data-t="supBtn"></a></div>
  </div>
</section>

<section id="start" style="padding-top:0">
  <div class="wrap">
    <div class="sec-h"><div class="eyebrow" data-t="goEye"></div><h2 data-t="goH"></h2><p data-t="goP"></p></div>
    <div class="forms">
      <form class="fcard" id="start-student" novalidate>
        <span class="tag s" data-t="fsTag"></span>
        <h3 data-t="fsH"></h3><p class="sub" data-t="fsP"></p>
        <div id="fsBody">
          <label for="s_name" data-t="fName"></label><input id="s_name" autocomplete="name" maxlength="100" required>
          <div class="two"><div><label for="s_phone" data-t="fPhone"></label><input id="s_phone" inputmode="tel" autocomplete="tel" dir="ltr" maxlength="20" required></div>
            <div><label for="s_parent" data-t="fParent"></label><input id="s_parent" inputmode="tel" dir="ltr" maxlength="20" required></div></div>
          <div class="two"><div><label for="s_cur" data-t="fCur"></label><select id="s_cur" required></select></div><div><label for="s_grade" data-t="fGrade"></label><select id="s_grade" required></select></div></div>
          <div class="hpw" aria-hidden="true"><label for="s_web">web</label><input id="s_web" tabindex="-1" autocomplete="off"></div>
          <button class="btn blue" type="submit" id="s_go" data-t="fsGo"></button>
          <p class="mini" data-t="fsMini"></p>
        </div>
        <div class="msg" id="s_msg" role="status" aria-live="polite"></div>
      </form>
      <form class="fcard" id="start-teacher" novalidate>
        <span class="tag t" data-t="ftTag"></span>
        <h3 data-t="ftFH"></h3><p class="sub" data-t="ftFP"></p>
        <div id="ftBody">
          <label for="t_name" data-t="fTName"></label><input id="t_name" autocomplete="name" maxlength="100" required>
          <div class="two"><div><label for="t_email" data-t="fEmail"></label><input id="t_email" type="email" autocomplete="email" dir="ltr" maxlength="120" required></div>
            <div><label for="t_phone" data-t="fTPhone"></label><input id="t_phone" inputmode="tel" autocomplete="tel" dir="ltr" maxlength="20" required></div></div>
          <div class="two"><div><label for="t_cur" data-t="fCur"></label><select id="t_cur" required></select></div><div><label for="t_sub" data-t="fSub"></label><select id="t_sub" required></select></div></div>
          <div class="two"><div><label for="t_grade" data-t="fTGrade"></label><input id="t_grade" maxlength="60"></div><div><label for="t_lang" data-t="fLang"></label><select id="t_lang"><option value="ar">العربية</option><option value="en">English</option></select></div></div>
          <label for="t_note" data-t="fNote"></label><textarea id="t_note" maxlength="300"></textarea>
          <div class="hpw" aria-hidden="true"><label for="t_web">web</label><input id="t_web" tabindex="-1" autocomplete="off"></div>
          <button class="btn blue" type="submit" id="t_go" data-t="ftGo"></button>
          <p class="mini" data-t="ftMini"></p>
        </div>
        <div class="msg" id="t_msg" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>
</section>

<section id="faq" style="padding-top:0">
  <div class="wrap" style="max-width:860px">
    <div class="sec-h"><div class="eyebrow" data-t="faqEye"></div><h2 data-t="faqH"></h2></div>
    <div id="faqs"></div>
  </div>
</section>
</main>

  function apply() {

  // ---------------- server ----------------

  function opt(v, text) { return el('option', { value: v, text: text }); }

  // ---------------- forms ----------------
  function fillForms() {
    var s = SITE || { students: [], teachers: [] }, cur = $('s_cur').value;
    var sc = $('s_cur'); sc.textContent = ''; sc.appendChild(opt('', t('choose')));
    s.students.forEach(function (c) { sc.appendChild(opt(c.code, c.name)); }); if (cur) sc.value = cur;
    fillGrades();
    var tcur = $('t_cur').value, tc = $('t_cur'); tc.textContent = ''; tc.appendChild(opt('', t('choose')));

    g.appendChild(opt('', t('choose'))); (c ? c.grades : []).forEach(function (x) { g.appendChild(opt(x, x || '-')); });
    if (c && c.grades.length === 1) g.value = c.grades[0]; else if (cur) g.value = cur;
  }
  function fillSubjects() {
    var c = (SITE ? SITE.teachers : []).filter(function (x) { return x.code === $('t_cur').value; })[0], s = $('t_sub'), cur = s.value; s.textContent = '';
    s.appendChild(opt('', t('choose'))); (c ? c.subjects : []).forEach(function (x) { s.appendChild(opt(x, x)); });

  $('s_cur').addEventListener('change', fillGrades);
  $('t_cur').addEventListener('change', fillSubjects);
  $('t_lang').addEventListener('change', function () { $('t_lang').setAttribute('data-touched', '1'); });

  $('start-student').addEventListener('submit', function (e) {
    e.preventDefault(); var b = $('s_go');

    if (!$('s_phone').value.trim()) { say('s_msg', t('e_PHONE_REQUIRED'), 'err'); return; }
