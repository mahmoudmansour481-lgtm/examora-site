<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examora - امتحانات ومتابعة للمدرس والطالب وولي الأمر</title>
<meta name="description" content="Examora: امتحانات بتتصحح لوحدها، مستوى كل طالب في كل درس بالألوان، امتحان جديد كل أسبوع، ومتابعة لولي الأمر. ثانوية عامة، بكالوريا، SAT، ACT، EST، IGCSE.">
<meta property="og:title" content="Examora">
<meta property="og:description" content="امتحانات ومتابعة للمدرس والطالب وولي الأمر - Exams and progress for teachers, students and parents.">
<meta name="theme-color" content="#f4f1ea">
<script>/* THEMES: the look saved on this device (exm_theme), set before the first paint; the first visit gets the green paper look */
(function () { var k = "editorial"; try { var s = localStorage.getItem("exm_theme"); if (/^(classic|editorial|navy|brown)$/.test(s || "")) k = s; } catch (e) { } document.documentElement.setAttribute("data-theme", k); })();</script>
<link rel="preload" href="fonts/readex-pro-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
@font-face{font-family:Readex;font-weight:160 700;font-display:swap;src:url(fonts/readex-pro-arabic-wght-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Readex;font-weight:160 700;font-display:swap;src:url(fonts/readex-pro-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
/* Examora: warm paper, deep pine ink, one saffron accent; editorial rules and numbered sections; quiet motion */
:root{--paper:#f4f1ea;--paper2:#ebe5d8;--card:#fffdf8;--ink:#15201e;--mut:#5d6864;--line:#ddd5c5;--pine:#0f4f47;--pine2:#0b3a34;--mint:#5fc2b2;--saff:#e3a13a;--saff2:#f6d9a3;
  --green:#1d7a52;--amber:#c9861c;--red:#b4322a;--r:20px;--ease:cubic-bezier(.2,.7,.2,1);--sh:0 1px 2px rgba(21,32,30,.05),0 14px 40px rgba(21,32,30,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Readex,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16.5px;line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(rgba(21,32,30,.05) 1px,transparent 1px);background-size:4px 4px}
main,header,footer{position:relative;z-index:1}
img{max-width:100%;display:block}
a{color:var(--pine)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 24px;border-radius:14px;border:1.5px solid transparent;font:inherit;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),background-color .2s,color .2s;overflow:hidden;isolation:isolate}
.btn:after{content:"";position:absolute;inset:0;z-index:-1;background:var(--saff);transform:scaleX(0);transform-origin:var(--o,right);transition:transform .35s var(--ease)}
[dir=ltr] .btn{--o:left}
.btn:hover{transform:translateY(-2px)}.btn:hover:after{transform:scaleX(1)}
.btn.pri,.btn.blue{background:var(--pine);color:#fffdf8;box-shadow:0 10px 26px rgba(15,79,71,.25)}
.btn.pri:hover,.btn.blue:hover{color:var(--ink)}
.btn.ghost,.btn.line{background:transparent;color:var(--ink);border-color:rgba(21,32,30,.35)}
.btn.sm{min-height:40px;padding:6px 16px;font-size:14px;border-radius:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--saff);outline-offset:2px}
.btn:disabled{opacity:.6;cursor:default;transform:none}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.82);backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid rgba(21,32,30,.08)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:21px;letter-spacing:.2px}
.brand img{width:36px;height:36px;border-radius:11px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.nav{display:flex;gap:2px;margin-inline-start:auto;align-items:center}
.nav a.lk{position:relative;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;padding:8px 12px}
.nav a.lk:after{content:"";position:absolute;inset-inline:12px;bottom:4px;height:2px;background:var(--saff);transform:scaleX(0);transition:transform .3s var(--ease)}
.nav a.lk:hover:after{transform:scaleX(1)}
.lang{background:transparent;color:var(--ink);border:1.5px solid rgba(21,32,30,.3);border-radius:12px;font:inherit;font-weight:600;font-size:14px;padding:6px 14px;cursor:pointer;margin-inline-start:6px}
@media (max-width:880px){.nav a.lk{display:none}}
@media (max-width:430px){.brand span{display:none}.top .wrap{gap:8px}}
/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 47px,rgba(21,32,30,.055) 47px 48px)}
.hero:after{content:"";position:absolute;width:620px;height:620px;inset-inline-end:-180px;top:-200px;border-radius:50%;background:radial-gradient(circle,rgba(227,161,58,.22),transparent 65%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:84px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px 4px 10px;font-weight:600;font-size:13.5px;color:var(--pine)}
.chip:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--saff);box-shadow:0 0 0 4px rgba(227,161,58,.2);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(227,161,58,0)}}
.hero h1{font-size:clamp(36px,5.6vw,68px);line-height:1.12;margin:18px 0 18px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.hero h1 .hl{position:relative;color:var(--pine);white-space:normal;background:linear-gradient(var(--saff2),var(--saff2)) no-repeat 0 88%/0% 28%;animation:mark 1.1s .5s var(--ease) forwards}
[dir=rtl] .hero h1 .hl{background-position:100% 88%}
@keyframes mark{to{background-size:100% 28%}}
.hero p.lead{font-size:clamp(17px,1.9vw,20px);color:var(--mut);margin:0 0 28px;max-width:590px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.login-l{color:var(--ink);font-weight:600;margin-top:16px;display:inline-block;text-underline-offset:5px}
.ticks{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:26px;font-weight:500;font-size:14px;color:var(--mut)}
.ticks span:before{content:"";display:inline-block;width:14px;height:2px;background:var(--saff);margin-inline-end:8px;vertical-align:middle}
.stage{position:relative;min-height:540px}
.desk{background:#fff;border-radius:14px;box-shadow:0 30px 70px rgba(21,32,30,.22);overflow:hidden;border:1px solid var(--line)}
.desk .bar{height:26px;background:var(--paper2);display:flex;align-items:center;gap:6px;padding:0 10px}
.desk .bar i{width:9px;height:9px;border-radius:50%;background:#cfc6b4}
.stage .desk{position:absolute;inset-inline-start:0;top:40px;width:90%;transform:rotate(-1.5deg)}
[dir=ltr] .stage .desk{transform:rotate(1.5deg)}
.phone{background:var(--ink);border-radius:34px;padding:8px;box-shadow:0 34px 60px rgba(21,32,30,.35)}
.phone img{border-radius:27px;background:#fff}
.stage .phone{position:absolute;inset-inline-end:0;top:0;width:42%;max-width:240px;animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.float{position:absolute;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;box-shadow:0 18px 40px rgba(21,32,30,.18);font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;border:1px solid var(--line)}
.float b{display:inline-block;width:10px;height:10px;border-radius:3px}
.f1{inset-inline-end:30%;top:6px;animation:bob 6s .8s ease-in-out infinite}.f2{inset-inline-end:4%;bottom:-14px;animation:bob 6.5s 1.6s ease-in-out infinite}
/* mastery card (the platform's own idea as the hero motif) */
.mw{position:absolute;inset-inline-start:4%;bottom:44px;width:min(260px,58%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 18px 44px rgba(21,32,30,.16)}
.mw h4{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600}
.mw .r{display:grid;grid-template-columns:1fr 34px;gap:2px 8px;align-items:center;font-size:12.5px;margin:6px 0}
.mw .r i{grid-column:1 / -1;height:7px;border-radius:7px;background:var(--paper2);overflow:hidden;position:relative}
.mw .r i:after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:var(--w);border-radius:7px;background:var(--c);transform:scaleX(0);transform-origin:var(--o,right);animation:grow 1.4s var(--d,0s) var(--ease) forwards}
[dir=ltr] .mw .r i:after{--o:left}
@keyframes grow{to{transform:scaleX(1)}}
.mw .r b{font-weight:700;text-align:end}
@media (max-width:940px){.hero .wrap{grid-template-columns:1fr;padding-top:40px}.stage{min-height:0;height:min(104vw,520px)}}
/* curricula band */
.marq{direction:ltr;overflow:hidden;border-bottom:1px solid var(--line);background:var(--pine);color:var(--paper);padding:14px 0;white-space:nowrap}
.marq .trk{display:inline-flex;gap:46px;padding-inline-end:46px;animation:marq 32s linear infinite;font-weight:600;font-size:18px;letter-spacing:.02em}
.marq span{display:inline-flex;align-items:center;gap:46px}.marq span:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--saff)}
@keyframes marq{to{transform:translateX(-50%)}}
/* sections: numbered like a magazine */
main{counter-reset:sec}
section{padding:88px 0}
.sec-h{max-width:780px;margin:0 0 40px;counter-increment:sec}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--pine);font-weight:600;font-size:14px;letter-spacing:.04em}
.eyebrow:before{content:counter(sec,decimal-leading-zero);font-variant-numeric:tabular-nums;color:var(--saff);font-weight:700}
.eyebrow:after{content:"";flex:0 0 56px;height:1px;background:var(--line)}
.sec-h h2{font-size:clamp(28px,3.8vw,44px);line-height:1.2;margin:10px 0 10px;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.sec-h p{color:var(--mut);margin:0;font-size:17.5px;max-width:640px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:#cfc5b1}
.card h3{margin:14px 0 6px;font-size:20px;color:var(--ink);font-weight:700;line-height:1.35}
.card p{margin:0;color:var(--mut)}
.ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--pine);border:1px solid var(--line);transition:background-color .3s,color .3s}
.card:hover .ic{background:var(--pine);color:#fffdf8}
.ic svg{width:24px;height:24px}
.who .card:nth-child(2){background:var(--pine);border-color:var(--pine)}.who .card:nth-child(2) h3{color:var(--card)}.who .card:nth-child(2) p{color:#cfe3de}.who .card:nth-child(2) .ic{background:rgba(255,255,255,.1);color:var(--saff);border-color:rgba(255,255,255,.15)}
/* how */
.steps{counter-reset:s}
.step{padding-top:70px}
.step:before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;top:18px;inset-inline-start:26px;font-size:40px;font-weight:700;color:var(--saff);line-height:1;font-variant-numeric:tabular-nums}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;border-radius:8px;padding:2px 12px;color:#fff}
/* showcase */
.show{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tab{font:inherit;font-weight:500;font-size:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s}
.tab:hover{border-color:var(--pine)}
.tab[aria-selected="true"]{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.view{display:grid;grid-template-columns:1fr 1.25fr;gap:40px;align-items:center}
.view .txt h3{font-size:clamp(23px,2.8vw,32px);color:var(--ink);margin:0 0 10px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.view .txt p{color:var(--mut);font-size:17px;margin:0 0 14px}
.view .txt ul{margin:0;padding:0;list-style:none}
.view .txt li{position:relative;padding-inline-start:26px;margin:8px 0}
.view .txt li:before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:14px;height:2px;background:var(--saff)}
.view .pic{display:flex;justify-content:center;animation:fadeUp .5s var(--ease) both}
.view .pic .phone{width:min(290px,76vw)}
.view .pic .desk{width:100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.demo-note{font-size:13px;color:var(--mut);margin-top:16px}
@media (max-width:860px){.view{grid-template-columns:1fr}.view .pic{order:-1}}
/* features */
.feat .card{padding:22px}.feat .card h3{font-size:17.5px}.feat .card p{font-size:15px}
.band{position:relative;overflow:hidden;background:var(--ink);color:var(--paper);border-radius:28px;padding:40px;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center}
.band:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 59px,rgba(255,255,255,.04) 59px 60px)}
.band > *{position:relative}
.band h2{margin:0 0 6px;font-size:clamp(23px,3vw,32px);line-height:1.3;font-weight:700}
.band p{margin:0;color:#c9d2ce}
.band .big{width:78px;height:78px;border-radius:22px;background:var(--saff);color:var(--ink);display:flex;align-items:center;justify-content:center}
.band .big svg{width:40px;height:40px}
.band .btn.pri{background:var(--saff);color:var(--ink)}.band .btn.pri:after{background:#fffdf8}
@media (max-width:760px){.band{grid-template-columns:1fr;text-align:center;padding:30px 22px}.band .big{margin:0 auto}}
.fun{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.fun{grid-template-columns:1fr}}
/* forms */
.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
@media (max-width:900px){.forms{grid-template-columns:1fr}}
.fcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--sh);scroll-margin-top:90px}
.fcard:before{content:"";position:absolute;inset-inline:30px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--saff)}
.fcard#start-teacher:before{background:var(--pine)}
.fcard h3{margin:0 0 4px;font-size:25px;color:var(--ink);font-weight:700}
.fcard .sub{color:var(--mut);margin:0 0 16px}
.tag{display:inline-block;font-weight:600;font-size:12.5px;border-radius:8px;padding:2px 10px;margin-bottom:10px;letter-spacing:.03em}
.tag.s{background:#fbecd2;color:#8a5a0c}.tag.t{background:#dcebe7;color:var(--pine)}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);transition:border-color .2s,box-shadow .2s,background-color .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pine);background:#fff;box-shadow:0 0 0 4px rgba(15,79,71,.12)}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.hpw{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.msg{margin-top:12px;font-weight:600;min-height:1px}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.done{background:#e3f1ea;border:1px solid #b9dccb;border-radius:16px;padding:16px;color:#14563a;font-weight:600}
.fcard .btn{width:100%;margin-top:20px}
.mini{font-size:13px;color:var(--mut);margin-top:10px}
/* faq */
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 22px;margin-bottom:10px;transition:border-color .2s}
details[open]{border-color:var(--pine)}
summary{cursor:pointer;font-weight:600;font-size:17px;padding:14px 0;color:var(--ink);list-style:none;display:flex;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary:after{content:"";margin-inline-start:auto;width:12px;height:12px;flex:0 0 12px;border-inline-end:2px solid var(--pine);border-bottom:2px solid var(--pine);transform:rotate(45deg);transition:transform .3s var(--ease)}
details[open] summary:after{transform:rotate(-135deg)}
details p{margin:0 0 16px;color:var(--mut);animation:fadeUp .35s var(--ease) both}
footer{background:var(--ink);color:#b7c2bd;padding:38px 0;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
footer a{color:#f4f1ea;font-weight:600}
footer .brand{color:#f4f1ea}
.sp{flex:1}
.hide{display:none!important}
/* reveal on scroll (added by the script; without it everything is simply shown) */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--rd,0s)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hero h1 .hl{background-size:100% 28%}.mw .r i:after{transform:none}}

/* THEMES (owner 2026-10-24): the same four looks as the apps; only the colour tokens change */
html[data-theme=classic]{--paper:#f4f7fe;--paper2:#e6edfb;--card:#ffffff;--ink:#0e1b3d;--mut:#4f5f82;--line:#dce5f8;--pine:#1650c8;--pine2:#0b2c8f;--mint:#19a7ff;--saff:#ffb000;--saff2:#ffe3a3;--green:#16803c;--amber:#b77f00;--red:#c62828}
html[data-theme=navy]{--paper:#f2f4f8;--paper2:#e3e8f1;--card:#ffffff;--ink:#111a2e;--mut:#56617a;--line:#d9dfe9;--pine:#1b2f5c;--pine2:#121f3f;--mint:#8fb0ff;--saff:#c9a227;--saff2:#efe0a8;--r:14px}
html[data-theme=brown]{--paper:#f6efe5;--paper2:#ecdfcc;--card:#fffaf3;--ink:#2b1d14;--mut:#715f52;--line:#e2d2bc;--pine:#6b3f22;--pine2:#4e2c16;--mint:#e3a779;--saff:#d0733f;--saff2:#f2cfb4;--green:#3d7a37;--r:24px}
.thm{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;margin-inline-start:6px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);background:transparent;cursor:pointer}
.thm i{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--pine) 0 50%,var(--saff) 50% 100%)}
#thmMenu{position:fixed;z-index:200;min-width:230px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.2);padding:8px}

  function renderFeats() {
    var box = $('feats'); box.textContent = '';
    for (var i = 1; i <= 12; i++) box.appendChild(el('div', { 'class': 'card' }, [el('div', { 'class': 'ic' }, [icon('f' + i)]), el('h3', { text: t('f' + i + 'h') }), el('p', { text: t('f' + i + 'p') })]));
    box = $('funs'); box.textContent = '';
    for (i = 1; i <= 4; i++) box.appendChild(el('div', { 'class': 'card' }, [el('div', { 'class': 'ic' }, [icon('g' + i)]), el('h3', { text: t('g' + i + 'h') }), el('p', { text: t('g' + i + 'p') })]));
  }
  function renderFaq() {
    var box = $('faqs'); box.textContent = '';
    for (var i = 1; i <= 6; i++) box.appendChild(el('details', {}, [el('summary', { text: t('q' + i) }), el('p', { text: t('a' + i) })]));
  }
  function wa() {
    var n = SITE && SITE.whatsapp ? String(SITE.whatsapp).replace(/\D/g, '') : '', a = $('waFoot');
    a.classList.toggle('hide', !n); if (n) a.setAttribute('href', 'https://wa.me/' + n + '?text=' + encodeURIComponent(t('waHello')));
  }

  // ---------------- server ----------------
  function post(body, cb) {
    var url = execUrl(); if (!url || typeof fetch !== 'function') { cb({ ok: false, code: 'NETWORK' }); return; }
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
      .then(function (r) { return r.json(); }).then(function (j) { cb(j && typeof j === 'object' ? j : { ok: false, code: 'ERROR' }); })
      .catch(function () { cb({ ok: false, code: 'NETWORK' }); });
  }
  function errMsg(r) { var k = 'e_' + String((r && r.code) || 'ERROR'); return t(k) || t('e_ERROR'); }
  function say(id, text, kind) { var m = $(id); m.textContent = text || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  function opt(v, text) { return el('option', { value: v, text: text }); }

  // ---------------- forms ----------------
  function fillForms() {
    var s = SITE || { students: [], teachers: [] }, cur = $('s_cur').value;
    var sc = $('s_cur'); sc.textContent = ''; sc.appendChild(opt('', t('choose')));
    s.students.forEach(function (c) { sc.appendChild(opt(c.code, c.name)); }); if (cur) sc.value = cur;
    fillGrades();
    var tcur = $('t_cur').value, tc = $('t_cur'); tc.textContent = ''; tc.appendChild(opt('', t('choose')));
    s.teachers.forEach(function (c) { tc.appendChild(opt(c.code, c.name)); }); if (tcur) tc.value = tcur;
    fillSubjects();
    if (SITE && !s.students.length) say('s_msg', t('soon'), ''); else if ($('s_msg').textContent === T.ar.soon || $('s_msg').textContent === T.en.soon) say('s_msg', '');
    $('t_lang').value = $('t_lang').getAttribute('data-touched') ? $('t_lang').value : LANG;
  }
  function fillGrades() {
    var c = (SITE ? SITE.students : []).filter(function (x) { return x.code === $('s_cur').value; })[0], g = $('s_grade'), cur = g.value; g.textContent = '';
    g.appendChild(opt('', t('choose'))); (c ? c.grades : []).forEach(function (x) { g.appendChild(opt(x, x || '-')); });
    if (c && c.grades.length === 1) g.value = c.grades[0]; else if (cur) g.value = cur;
  }
  function fillSubjects() {
    var c = (SITE ? SITE.teachers : []).filter(function (x) { return x.code === $('t_cur').value; })[0], s = $('t_sub'), cur = s.value; s.textContent = '';
    s.appendChild(opt('', t('choose'))); (c ? c.subjects : []).forEach(function (x) { s.appendChild(opt(x, x)); });
    if (cur) s.value = cur;
  }
  $('s_cur').addEventListener('change', fillGrades);
  $('t_cur').addEventListener('change', fillSubjects);
  $('t_lang').addEventListener('change', function () { $('t_lang').setAttribute('data-touched', '1'); });

  $('start-student').addEventListener('submit', function (e) {
    e.preventDefault(); var b = $('s_go');
    if (!$('s_name').value.trim()) { say('s_msg', t('e_NAME_REQUIRED'), 'err'); return; }
    if (!$('s_phone').value.trim()) { say('s_msg', t('e_PHONE_REQUIRED'), 'err'); return; }
    if (!$('s_parent').value.trim()) { say('s_msg', t('e_PARENT_PHONE_REQUIRED'), 'err'); return; }
    if (!$('s_cur').value) { say('s_msg', t('e_CURRICULUM_INVALID'), 'err'); return; }
    if (!$('s_grade').value && $('s_grade').options.length > 1) { say('s_msg', t('e_GRADE_REQUIRED'), 'err'); return; }
    b.disabled = true; say('s_msg', t('sending'));
    post({ action: 'studentTrial', name: $('s_name').value, phone: $('s_phone').value, parentPhone: $('s_parent').value, curriculum: $('s_cur').value, grade: $('s_grade').value,
      lang: LANG, hp: $('s_web').value, ms: Date.now() - SHOWN.s }, function (r) {
      if (r.ok && r.data && safeLink(r.data.open)) { say('s_msg', t('opening'), 'ok'); window.location.href = r.data.open; return; }
      b.disabled = false; say('s_msg', errMsg(r), 'err');
      if (r.params && r.params.whatsapp && !(SITE && SITE.whatsapp)) { SITE = SITE || { students: [], teachers: [] }; SITE.whatsapp = r.params.whatsapp; wa(); }
    });
  });
  $('start-teacher').addEventListener('submit', function (e) {
    e.preventDefault(); var b = $('t_go');
    if (!$('t_name').value.trim()) { say('t_msg', t('e_NAME_REQUIRED'), 'err'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('t_email').value.trim())) { say('t_msg', t('e_EMAIL_INVALID'), 'err'); return; }
    if (!$('t_phone').value.trim()) { say('t_msg', t('e_PHONE_REQUIRED'), 'err'); return; }
    if (!$('t_cur').value) { say('t_msg', t('e_CURRICULUM_INVALID'), 'err'); return; }
    if (!$('t_sub').value) { say('t_msg', t('e_SUBJECT_REQUIRED'), 'err'); return; }
    b.disabled = true; say('t_msg', t('sending'));
    post({ action: 'teacherRequest', name: $('t_name').value, email: $('t_email').value.trim(), phone: $('t_phone').value, curriculum: $('t_cur').value, subject: $('t_sub').value,
      lang: $('t_lang').value, note: $('t_note').value, hp: $('t_web').value, ms: Date.now() - SHOWN.t }, function (r) {
      b.disabled = false;
      if (r.ok) { $('ftBody').classList.add('hide'); say('t_msg', ''); $('t_msg').appendChild(el('div', { 'class': 'done', text: t('tDone') })); return; }
      say('t_msg', errMsg(r), 'err');
    });
  });
  // the time a person needs to fill a form (bots are faster)
  function seen(id, key) { var f = $(id); var mark = function () { if (!SHOWN[key]) SHOWN[key] = Date.now(); }; f.addEventListener('focusin', mark); f.addEventListener('pointerdown', mark); }
  seen('start-student', 's'); seen('start-teacher', 't');

  // ---------------- motion: cards and headings rise in as they come into view ----------------
  var IO = null;
  function reveal() {
    if (!('IntersectionObserver' in window) || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    IO = IO || new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); IO.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    var n = document.querySelectorAll('.sec-h, .card, .fcard, .band, details, .view .txt');
    for (var i = 0; i < n.length; i++) {
      if (n[i].classList.contains('rv')) continue;
      n[i].classList.add('rv'); var k = Array.prototype.indexOf.call(n[i].parentNode.children, n[i]); n[i].style.setProperty('--rd', (Math.min(k, 5) * 0.06) + 's');
      IO.observe(n[i]);
    }
  }

  // ---------------- start ----------------
  var q = String(location.search || ''), m = /[?&]lang=(ar|en)\b/.exec(q), saved = null;
  try { saved = localStorage.getItem('exm_site_lang'); } catch (e) { saved = null; }
  LANG = m ? m[1] : (saved === 'en' || saved === 'ar') ? saved : 'ar';   // Arabic first; the English ads link with ?lang=en
  fillIcons(); apply(); reveal();
  post({ action: 'site' }, function (r) { if (r.ok && r.data) { SITE = r.data; fillForms(); wa(); } });
})();
</script>
</body>
</html>
